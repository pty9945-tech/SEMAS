id:e,label:t,value:n,note:r,evidence:oe(i)}),ce={title:`신용취약소상공인자금`,subtitle:`직원용 빠른 안내 · 신청요건부터 서류·제한사항까지`,year:2026,sourceRevision:`2026-08-04`,reviewedAt:`2026-10-22`,source:oe(`1. 개요 · 2. 대출제한대상 · 3. 제출서류 · 4. 대출절차`),intro:`제공받은 운용지침을 상담 순서에 맞춰 정리했어요. 요약을 먼저 보고, 해당 항목을 펼쳐 예외와 근거를 확인하세요. 접수 여부·예산·이후 변경공고는 공식 누리집에서 별도로 확인해야 합니다.`,highlights:[se(`score`,`개인신용평점`,`NCB 839점 이하`,`신청 당시 조회한 점수 · 기업등급과 별개`,`1. 개요 — 지원대상 ③; 4. 대출절차 ⑤`),se(`age`,`인정 업력`,`90일 이상`,`등록일 전 업력은 최대 20일 인정`,`1. 개요 — 지원대상 ②`),se(`education`,`신용관리교육`,`신청 전 이수`,`지식배움터 제휴교육의 신용회복위원회 교육`,`1. 개요 — 지원대상 ①`),se(`limit`,`자금 한도`,`최대 3,000만원`,`관련 잔액·기업등급 한도에 따라 달라짐`,`1. 개요 — 대출한도·산정방식`),se(`minimum`,`최소 신청액`,`1,000만원 이상`,`100만원 단위 · 관련 잔액 차감 후 확인`,`1. 개요 — 대출한도 운영방법·산정방식`),se(`rate`,`금리`,`기준금리 + 1.6%p`,`분기별 변동 · 현재 기준금리 별도 확인`,`1. 개요 — 대출금리`),se(`period`,`대출기간`,`5년 · 거치 2년 포함`,`거치 후 매월 원금균등분할상환`,`1. 개요 — 대출기간·상환방식`)],sections:[{id:`eligibility`,title:`신청요건`,summary:`사전교육·업력·신용평점과 기업별 한도 조건을 함께 확인합니다.`,items:[w(`education`,`지정 신용관리교육을 미리 이수했나요?`,`소상공인 지식배움터의 제휴교육 중 신용회복위원회 신용관리교육을 신청 전에 이수해야 합니다.`,[`다른 금융교육을 들었다는 답변만으로 충족 처리하지 않고 교육명과 이수 여부를 확인합니다.`],`1. 개요 — 지원대상 ①; 4. 대출절차 ⑤ 간이심사 항목`,[`사전교육`,`지식배움터`,`신용회복위원회`]),w(`business-age`,`신청일 기준 인정 업력 90일 이상`,`개인은 사업자등록증명상 개업일, 법인은 등기상 회사성립일을 기준으로 합니다.`,[`개업일이 사업자등록일보다 빠르면 등록일 이전의 업력은 최대 20일까지만 인정합니다.`,`90일은 포함되며, 단순히 개업일부터 지난 날짜만 세어 판단하지 않습니다.`],`1. 개요 — 지원대상 ②`,[`90일`,`개업일`,`사업자등록일`,`20일`]),w(`credit-score`,`신청 당시 NCB 개인신용평점 839점 이하`,`개인사업자는 대표자(주채무자), 법인은 대표이사 중 1인의 점수를 봅니다.`,[`심사에서는 대출 신청 당시 조회한 NCB 개인신용평점을 기준으로 합니다. 839점은 포함, 840점은 초과입니다.`,`NCB 개인신용평점과 NICE SOHO ML 기업신용등급은 서로 다른 기준입니다. 다른 기관 점수로 대신 판단하지 않습니다.`],`1. 개요 — 지원대상 ③; 4. 대출절차 ⑤ 심사·대출한도 사정`,[`NCB`,`NICE`,`839`,`840`,`KCB`]),w(`business-scope`,`소상공인인 영리 사업자`,`개인과세·면세사업자 또는 영리법인 본점이 대상이며 대출제한대상에 해당하지 않아야 합니다.`,[`지침은 소상공인 기준 충족을 요구합니다. 이 사이트의 상담 흐름에서는 사용자의 요청에 따라 기본 소상공인 요건 충족을 전제로 합니다.`,`지침에 기재된 상시근로자 수 기준은 5인 미만이며, 광업·제조업·건설업·운수업은 10인 미만입니다. 그 밖의 소상공인 규모·자격 기준도 함께 충족해야 합니다.`,`비영리사업자, 외국법인의 본·지점, 영리법인의 지점 등은 지원 제외입니다.`,`규모 기준과 별개로 영업 여부·융자제외 업종·대출제한사항을 확인합니다.`],`1. 개요 — 지원대상 ④~⑥; 2. 대출제한대상 5 및 말미 업종 기준`,[`소상공인`,`영리`,`법인`,`본점`,`지점`,`제외업종`]),w(`purpose`,`운전자금 용도로 신청`,`제품생산 비용과 기업경영에 필요한 운전자금을 지원합니다.`,[`이 자금의 지원용도를 시설자금이나 기존 대출 대환으로 안내하지 않습니다.`,`신청 시 제시한 자금집행계획과 실제 사업 용도 사용 여부를 사후 점검할 수 있습니다.`],`1. 개요 — 자금용도; 4. 대출절차 ⑦ 사후관리`,[`운영자금`,`운전자금`,`시설`,`대환`,`사용용도`]),w(`company-grade`,`기업등급 9~10등급이면 매출 기준 추가 확인`,`NICE SOHO ML 9~10등급이면서 연간매출액이 1억 9,700만원 미만이면 대출 불가입니다.`,[`1억 9,700만원과 같은 금액은 이 매출 제한의 “미만”에 해당하지 않지만, 다른 요건·심사를 함께 확인해야 합니다.`,`1~8등급에도 한도 등 다른 기준은 적용됩니다. 등급을 모르면 확인 필요로 남깁니다.`,`기업등급별 세부 한도는 원문 병합표의 정확한 열 대응이 확인되지 않아 이 안내에서 임의로 배정하지 않습니다.`],`1. 개요 — 기업신용등급(NICE SOHO ML)별 대출한도 표 및 주석 **`,[`NICE SOHO ML`,`9등급`,`10등급`,`매출`,`197백만원`]),w(`available-balance`,`잔액 차감 후 신청가능액 1,000만원 이상`,`관련 자금의 기존 대출잔액과 기업신용등급별 한도를 함께 확인합니다.`,[`합산 대상: 2023년 소상공인·전통시장자금, 2024년 저신용 소상공인 자금, 2025년·2026년 신용취약소상공인자금.`,`관련 잔액을 차감한 신청가능금액이 1,000만원 미만이면 신청 불가입니다. 최소 신청·승인 금액과 100만원 단위를 확인합니다.`],`1. 개요 — 대출한도·산정방식; 4. 대출절차 ⑤ 대출승인 금액`,[`잔액`,`최소금액`,`1000만원`,`전통시장`,`저신용`])]},{id:`terms`,title:`한도·금리·상환`,summary:`최고한도는 승인액이 아닙니다. 관련 잔액과 기업등급에 따른 한도를 확인하세요.`,items:[w(`loan-limit`,`동일관계기업당 3,000만원 이내`,`최대상한·관련 잔액을 반영한 신청금액·기업등급별 한도 중 적용 가능한 최소 금액을 봅니다.`,[`동일관계기업: 동일인이 대표자 또는 실제경영자인 개인·법인기업, 동일인이 발행주식 총수의 50% 이상을 소유한 법인기업.`,`관련 2023~2026년 자금 잔액을 합산하며 최소 1,000만원, 100만원 단위로 신청합니다. 최저 승인액은 1,000만원이고 100만원 단위로 절사합니다.`,`동일관계기업의 운전자금 잔액 총한도는 자금 종류·지급연도와 무관하게 5억원, 시설 포함 시 10억원 이내이며 대리대출 잔액도 포함합니다.`,`기업등급별 3,000·2,500·2,000·1,500만원의 등급 대응은 원문 표 재확인이 필요합니다. 여기서는 확정표나 자동 한도 계산을 제공하지 않습니다.`],`1. 개요 — 대출한도·운영방법·산정방식; 4. 대출절차 ⑤ 대출승인 금액`,[`동일관계기업`,`한도`,`잔액`,`5억원`,`10억원`]),w(`interest-rate`,`정책자금 기준금리 + 1.6%p`,`분기별 변동금리입니다. 현재 기준금리 숫자는 별도로 확인해야 합니다.`,[`첨부 지침만으로 현재 분기 최종 적용금리를 확정할 수 없습니다.`,`유형별 우대금리와 대출 후 금리인하제도는 각각의 요건·증빙을 확인합니다.`],`1. 개요 — 대출금리`,[`기준금리`,`변동금리`,`1.6`]),w(`preferential-rates`,`유형별 금리우대 합계 최대 0.8%p`,`동일 유형 안에서는 중복 우대하지 않습니다.`,[`정책 우대 0.1%p: 소진공·은행권 컨설팅, 제로페이, 디지털 온누리상품권 가맹점. 소진공은 신청일 기준 3년 이내 역량강화 컨설팅, 은행권은 지침의 기간·3시간 이상 수료요건을 확인합니다.`,`정책 배려 0.1%p: 여성기업, 장애인기업, 일회용품 사용규제 적응 우수기업.`,`사회안전망 0.1%p: 자영업자 고용보험, 전통시장 화재공제, 풍수해보험, 노란우산공제.`,`성실상환 0.3%p: 최근 3년 이내 연속 10일 이상 연체 없이 소진공 직접대출 원금분할상환 중이거나 완제한 경우. 사고기업·자율상환제·손실보상선지급 계좌는 제외하며 지침의 계좌별 판단기준을 확인합니다.`,`지역 격차해소 0.2%p: 비수도권 소재 소상공인. 수도권 내 가평군·연천군·강화군·옹진군도 포함합니다.`],`1. 개요 — 소상공인정책자금 우대금리 적용대상 및 주석`,[`우대금리`,`0.8`,`컨설팅`,`여성`,`장애인`,`노란우산`,`성실상환`,`지역`]),w(`rate-reduction`,`대출 1년 후 신용회복 시 금리인하`,`70점 이상 상승 또는 840점 이상 회복하면 잔여기간 금리 0.5%p 인하 제도가 있습니다.`,[`대출 후 1년이 경과한 시점의 신용평점 회복조건입니다. 신청 당시 839점 이하라는 진입 요건과 구분합니다.`,`두 회복조건은 “또는” 관계이며 적용 확인은 공식 절차에 따릅니다. 자동 적용 여부는 이 안내에서 확정하지 않습니다.`],`1. 개요 — 대출금리 중 금리인하제도`,[`금리인하`,`70점`,`840점`,`1년`,`0.5`]),w(`repayment`,`5년 상환 · 거치기간 2년 포함`,`거치기간이 끝나면 매월 원금을 균등하게 나누어 상환합니다.`,[`전액 또는 일부 조기상환이 가능하며 중도상환수수료는 면제됩니다.`],`1. 개요 — 대출기간·상환방식`,[`5년`,`2년`,`거치`,`원금균등`,`중도상환`])]},{id:`documents`,title:`필요서류`,summary:`처음 신청할 때, 정책우선도 선정 후, 해당 시 보완·약정 서류를 구분해서 안내하세요.`,items:[w(`online-application`,`① 처음 신청할 때 · 온라인 작성·동의`,`자가진단·윤리준수 약속·대출신청서와 필수 동의서를 온라인으로 제출합니다.`,[`자가진단(서식2), 윤리준수 약속(서식3), 대출신청서(서식4): 각 1부.`,`개인기업·법인: 기업(신용)정보 수집·이용·제공·조회 동의서(공통지침 서식1-2).`,`개인기업 대표자·법인 대표이사: 본인 행정정보 제공 요구서(공통1-1), 필수 개인(신용)정보 동의서(공통2-1), 여신협 개인(신용)정보 동의서(공통2-3)와 금융거래정보 제공 동의서(공통2-4).`,`개인(신용)정보 동의서 공통2-2는 선택 서식입니다. 선택 동의를 필수로 안내하지 않습니다.`],`3. 제출서류 — ① 대출 신청 시 제출서류`,[`처음 신청`,`온라인`,`자가진단`,`신청서`,`동의서`,`필수`,`선택`]),w(`selected-plan`,`② 선정 후 필수 · 사업계획서·대상자별 동의`,`기업현황 및 사업계획서는 정책우선도평가에서 선정된 뒤 제출하는 서류입니다.`,[`기업현황 및 사업계획서(서식1): 1부.`,`법인·보증인 법인: 기업(신용)정보 동의서(서식5)에 대표 자서 및 법인인감을 날인하여 파일 제출.`,`개인 공동대표자·법인 공동/각자대표이사·실제경영자: 행정정보 제공 요구서(서식6), 필수 개인(신용)정보 동의서(서식7-1). 서식7-2는 선택입니다.`],`3. 제출서류 — ② 정책우선도평가 선정 시 제출서류, ① 필수 제출 서류 ❶~❷`,[`선정 후`,`사업계획서`,`법인`,`공동대표`,`실제경영자`]),w(`selected-identity`,`② 선정 후 필수 · 대표자 실명확인`,`대표자·공동대표자·법인 대표이사·실제경영자의 실명확인증표 중 1부를 확인합니다.`,[`주민등록증, 운전면허증, 외국인등록증, 국내거소신고증, 영주증 또는 예외적으로 인정되는 여권.`,`여권은 다른 실명확인증표 제출이 어려울 때 예외 인정하며, 주민등록번호 뒷자리가 없는 여권은 여권정보증명서를 함께 제출합니다.`,`이 상담 도우미에는 신분증이나 개인식별정보를 입력·업로드하지 않습니다.`],`3. 제출서류 — ②-① 필수 제출 서류 ❸ 대표자 실명확인`,[`선정 후`,`신분증`,`실명확인`,`여권`]),w(`business-premises`,`② 선정 후 · 주된 사업장 확인`,`등기서류는 1개월 이내 발급분, 임차 사업장은 임대차계약서 사본을 확인합니다.`,[`토지·건물 등기사항전부증명서: 제출(발급)용, 말소사항 포함. 임대차계약서를 제출하면 등기서류 제출을 생략할 수 있습니다.`,`법인 본점과 주사업장 주소가 다르면 두 곳 모두 확인합니다. 최근 3개월 내 사업장 주소 변경 시 이전 주소의 등기서류도 추가합니다.`,`미등기 건물은 건축물대장, 무허가 건물은 토지 등기서류만 제출합니다. 영업용 차량을 쓰는 업종은 자동차등록원부등본을 확인합니다.`,`전대차는 임대인 동의가 기입·서명 또는 날인된 계약서, 또는 별도 전대차동의서가 필요합니다. 임대인 주민등록번호 뒷자리는 가립니다.`,`부득이하게 임대차계약서가 없는 무상임차는 사업장 무상사용 사실 확인서(공통35), 임차 영업용 차량은 위·수탁(지입)계약서를 확인합니다.`],`3. 제출서류 — ②-① 필수 제출 서류 ❹ 주된 사업장·거주주택 확인`,[`선정 후`,`사업장`,`등기`,`임대차`,`1개월`,`전대차`,`무상사용`]),w(`residential-premises`,`② 선정 후 · 거주주택 확인`,`대표자·공동대표자·법인 대표이사·실제경영자의 주민등록주소지 주택을 확인합니다.`,[`토지·건물 등기사항전부증명서: 1개월 이내, 제출(발급)용, 말소사항 포함. 주택 임대차계약서를 제출하면 등기서류를 생략할 수 있습니다.`,`최근 3개월 내 주소 변경 시 이전 주소의 등기서류를 추가합니다. 미등기·무허가 건물의 대체서류는 사업장과 같은 지침 기준으로 확인합니다.`,`거주주택의 임차인이 채무자이면 임대차계약서 사본을 제출하며 임대인 주민등록번호 뒷자리는 가립니다. 부득이한 무상거주는 무상거주 사실 확인서(공통35-1)를 확인합니다.`],`3. 제출서류 — ②-① 필수 제출 서류 ❹ 주된 사업장·거주주택 확인`,[`선정 후`,`주택`,`임대차`,`등기`,`1개월`,`무상거주`]),w(`corporate-documents`,`③ 해당 시 · 법인 추가서류`,`법인인감·법인등기·주주/주식변동·보험료 완납 자료를 확인합니다.`,[`법인인감증명서와 법인등기사항전부증명서는 각 1개월 이내 발급분.`,`법인 주주명부 및 주식등변동상황명세서 사본.`,`고용·산재보험료완납증명원 또는 사업자4대보험완납증명서.`],`3. 제출서류 — ②-② 법인 추가 제출 자료(해당 시)`,[`법인`,`해당 시`,`인감`,`주주명부`,`4대보험`,`1개월`]),w(`rate-documents`,`③ 해당 시 · 금리우대 증빙`,`신청하는 우대 유형에 해당하는 증빙만 추가 안내합니다.`,[`은행권 컨설팅: 소상공인 경영컨설팅(교육) 프로그램 이수 확인서.`,`사회안전망: 자영업자고용보험 가입통지서, 전통시장 화재공제 가입증명서, 풍수해보험 가입 증권 사본, 노란우산공제 가입증서 중 해당 자료.`,`각 1부이며 1개월 이내 또는 증명서상 유효기간 이내 등 지침 기준을 확인합니다. 화재공제는 공제기간 내여야 합니다.`],`3. 제출서류 — ②-③ 금리우대 자료(해당 시)`,[`금리우대`,`해당 시`,`컨설팅`,`노란우산`,`고용보험`]),w(`supplementary-status`,`④ 보완 요청 시 · 사업자·근로자·세금·주소`,`공공마이데이터 등으로 확인하되 필요한 경우 추가 요청할 수 있는 서류입니다.`,[`사업자등록증명(발급 1개월 이내) 또는 사업자등록증 사본 중 1부. 겸업 시 주업종 확인용 최근 1년 재무제표 등 지침상 대체서류를 확인합니다.`,`근로자 없음: 건강보험자격득실확인서. 근로자 있음: 월별 원천징수·건강보험·고용/산재보험 자료 중 1부(1개월 이내). 유효한 소상공인확인서는 참고자료입니다.`,`국세 납세증명서와 지방세 납세증명서: 각 1부, 증명서상 유효기간 이내. 대표자·공동대표자·법인·법인 대표이사·실제경영자·보증인 법인 등 해당 대상을 구분합니다.`,`주민등록표등본 등 주소확인 자료: 1개월 이내. 주채무자 외 주민등록번호 뒷자리는 가리고, 현주소 전입일이 최근 3개월 이전이면 주소변동 이력 표시는 생략 가능합니다.`],`3. 제출서류 — ②-④ 보완 요청 가능 서류 ❶~❹; 4. 대출절차 ②`,[`보완`,`마이데이터`,`사업자등록`,`근로자`,`세금`,`등본`]),w(`supplementary-revenue`,`④ 보완 요청 시 · 매출·재무자료`,`사업자 유형에 맞는 최근 3년 자료를 확인하며, 발급 1개월 이내 기준을 적용합니다.`,[`개인 복식부기 대상·법인: 표준재무제표증명. 개인 면세: 면세사업자수입금액증명. 개인 과세 간편장부 대상: 부가가치세과세표준증명.`,`최근 1년 보충서류와 업력에 따른 제출 가능 기간·대체서류는 해당 서류표와 공통지침을 대조합니다. 모든 사업자에게 동일한 서류를 일괄 요구하지 않습니다.`],`3. 제출서류 — ②-④ 보완 요청 가능 서류 ❺ 매출액 등 재무상황 확인`,[`보완`,`매출`,`재무제표`,`면세`,`과세`,`3년`,`1개월`]),w(`agreement-documents`,`⑤ 약정할 때 · 작성·지참·교부 자료`,`신청 서류와 약정 단계의 자료를 구분해 안내합니다.`,[`공통 작성: 대출거래약정서, 대출거래상품설명서, 자동이체출금신청서. 출금계좌 통장사본(표제부) 또는 계좌개설확인서 중 1부와 본인확인증표를 확인합니다. 대출거래기본약관은 교부합니다.`,`법인대출: 법인인감 지참, 책임경영이행약정서와 자금집행계획서 작성. 법인보증이 있는 경우 근보증서 작성.`,`개인은 전자약정, 법인은 대표이사가 지역센터를 방문하여 대면약정합니다.`],`3. 제출서류 — ③ 대출약정 자료; 4. 대출절차 ⑥`,[`약정`,`통장`,`자동이체`,`법인인감`,`전자약정`,`대면약정`])]},{id:`restrictions`,title:`제한사항·예외`,summary:`2026년 7월 13일 접수 건부터 적용하는 15개 제한항목입니다. 신청기업뿐 아니라 개인 공동대표자, 법인 공동·각자 대표이사, 실제경영자, 보증인 법인 등 지침의 적용대상도 확인하세요. 예외는 증빙과 심사 확인이 필요합니다.`,items:[w(`restriction-tax`,`1. 세금 체납`,`국세 또는 지방세 체납 중이면 원칙적으로 제한됩니다.`,[`징수유예(납부고지 유예·납부기한 등 연장), 체납처분유예(압류·매각 유예) 또는 징수특례는 신청 가능한 예외입니다.`,`승인 서류의 정확한 제도명과 적용 여부를 확인합니다. 체납이 있다는 사실만으로 예외 검토를 생략하지 않습니다.`],`2. 대출제한대상 — 적용기준 및 1. 세금체납`,[`국세`,`지방세`,`체납`,`유예`,`예외`]),w(`restriction-credit-info`,`2. 신용정보 등록`,`신용도판단정보 또는 공공정보에 등록된 경우 제한됩니다.`,[`신용도판단정보: 연체, 대위변제·대지급, 부도, 관련인, 금융질서문란 등.`,`공공정보: 세금·과태료 체납, 채무불이행자, 신용회복지원, 회생·개인회생·파산면책, 산재·고용보험료·임금 체납, 국외이주 신고, 새출발기금 채무조정 등.`,`다른 자금에 있는 채무조정 예외를 이 자금에 그대로 적용하지 않습니다.`],`2. 대출제한대상 — 2. 신용정보등록`,[`신용정보`,`공공정보`,`회생`,`파산`,`채무조정`,`새출발기금`]),w(`restriction-arrears`,`3. 현재·최근 연체`,`현재 연체 또는 최근 3개월 내 계속 30일 이상 연체 1회 이상·계속 10일 이상 연체 4회 이상 이력을 확인합니다.`,[`공단 및 금융기관 등의 대출금이 대상입니다. 과거 대지급·대손상각 등 이력이 확인되면 위 횟수·기간에 해당하지 않아도 제한할 수 있습니다.`,`경미한 사유로 신청대상에 포함 가능한 예: 연체기간 내내 본인 명의 요구불예금 잔액이 연체 원리금보다 많은 경우, 예·적금 담보대출 또는 보험환급금 범위의 보험계약대출 등.`,`예외 여부는 실제 자금·대출 성격과 증빙을 확인합니다.`],`2. 대출제한대상 — 3. 연체`,[`연체`,`3개월`,`30일`,`10일`,`4회`,`예금`,`보험`]),w(`restriction-property`,`4. 자가사업장·자가주택 권리침해`,`경매·공매 신청, 압류·가압류·가처분 또는 해제 후 3개월 이내이면 제한 여부를 확인합니다.`,[`주된 사업장과 거주주택의 소유관계는 대표자·배우자·법인·실제경영자·보증인 등 지침의 범위를 적용합니다.`,`신청일 현재 해제되었고 사업·신용 영향이 경미하다고 전결권자가 인정하는 경우, 행정기관 업무착오가 객관적 자료로 확인되는 경우, 해제된 영업용 차량 과태료 등 비조세성 압류는 예외 검토가 가능합니다.`,`권리침해 해제 시점은 등기접수일 기준입니다.`],`2. 대출제한대상 — 4. 자가사업장·자가주택 권리침해`,[`압류`,`가압류`,`경매`,`권리침해`,`3개월`,`예외`]),w(`restriction-closed`,`5. 휴업·폐업`,`신청업체가 휴·폐업 중이면 제한됩니다.`,[`신고가 없더라도 사실상 영업 중이라고 보기 어려우면 확인 대상입니다.`],`2. 대출제한대상 — 5. 휴·폐업`,[`휴업`,`폐업`,`영업`]),w(`restriction-reapply`,`6. 동일 연도 6개월 이내 재신청`,`동일 자금의 심사 부결·승인 전액 포기·운전자금 기지원은 각각의 기준일부터 6개월 이내 제한됩니다.`,[`부결: 대출부결 승인일. 승인된 대출결정자금 전액 포기(실효): 대출 승인일. 운전자금 기지원: 대출금 지급일.`,`기지원 대출금을 전액 조기상환한 경우 등 지침의 예외를 확인합니다. 시설자금 관련 예외를 이 자금의 지원용도가 시설자금이라는 뜻으로 해석하지 않습니다.`,`정책우선도평가에서 선정되지 않은 경우는 차기 신용취약소상공인자금 재신청이 가능합니다. 심사 부결과 혼동하지 않습니다.`],`2. 대출제한대상 — 6. 6개월 이내 재신청 불가; 4. 대출절차 ③ 정책우선도 평가`,[`재신청`,`6개월`,`부결`,`포기`,`미선정`,`조기상환`]),w(`restriction-marginal`,`7. 한계기업`,`매출 급감·자본 전액잠식·이자보상배율 기준을 확인하되 업력 7년 이하에는 이 항목을 적용하지 않습니다.`,[`최근 2년 연속 매출이 전년 대비 50% 이상 감소, 당기 적자이면서 자기자본 전액잠식, 최근 3년 연속 이자보상배율 1.0 미만 중 하나에 해당하는 경우.`,`자본잠식 및 이자보상배율은 복식부기 작성대상에만 적용합니다. 이자보상배율 산정 시 지침상 정부보조금·판매장려금을 영업이익에 가산할 수 있습니다.`,`7년과 같은 업력도 “7년 이하” 예외에 포함됩니다.`],`2. 대출제한대상 — 7. 한계기업`,[`한계기업`,`7년`,`매출감소`,`50%`,`자본잠식`,`이자보상배율`]),w(`restriction-debt-ratio`,`8. 부채비율 700% 초과`,`당기 표준재무제표상 부채비율 700% 초과 또는 자기자본 전액잠식 여부를 봅니다.`,[`업력 7년 이하, 도로 화물 운송업(4930)은 적용하지 않으며 복식부기 작성대상에만 적용합니다.`,`700%를 초과해도 제9호 차입금 비율이 매출의 100% 이하이고 전년 대비 최근 매출이 증가하면 지원 가능한 예외가 있습니다.`],`2. 대출제한대상 — 8. 부채비율 700% 초과`,[`부채비율`,`700%`,`7년`,`화물`,`4930`,`예외`]),w(`restriction-borrowing`,`9. 매출액 초과 차입금`,`신청일 총차입금이 당기 또는 최근 1년 매출의 100%를 초과하는지 확인합니다.`,[`법인은 법인 명의 대출(대표이사 개인대출 제외), 개인기업은 대표자 명의 기업대출(공동대표자 명의 제외)을 기준으로 합니다.`,`업력 7년 이하, 도로 화물 운송업(4930)은 이 항목을 적용하지 않습니다.`,`어음할인·수출환어음·신용장·외상매출채권 담보·구매자금·팩토링·예적금/보험/증권 담보대출·회사채·자가사업장 구입 담보대출 등 지침 열거 항목은 총차입금에서 제외할 수 있습니다.`,`재해확인증을 발급받아 지원받은 재해자금과 자금지출이 없는 지급보증도 제외 가능 여부를 확인합니다.`],`2. 대출제한대상 — 9. 매출액 초과 차입금`,[`차입금`,`100%`,`7년`,`화물`,`매출`,`담보대출`]),w(`restriction-managed`,`10. 공단의 대출제한 관리기업`,`고의실패·용도 외 사용 제재·대출사고기업 등의 관리 여부를 확인합니다.`,[`성공불융자 고의실패 판정 기업과 그 대표자가 운영하는 기업은 판정일부터 3년간 제한됩니다.`,`용도 외 사용 제재 기업과 그 대표자가 운영하는 기업은 제재조치일부터 3년간 제한됩니다.`,`대출사고기업으로 관리되는 업체와 그 대표자 운영 기업도 대상이며, 지침상 사고관리·채무조정 분할상환 약정 기업을 포함합니다.`],`2. 대출제한대상 — 10. 공단 대출제한 관리기업`,[`사고기업`,`제재`,`용도외사용`,`3년`,`고의실패`]),w(`restriction-operator`,`11. 법인 실제경영자 부적정`,`실제경영자가 지침상 인정되는 지위에 해당하는지 확인합니다.`,[`실제경영자가 (공동)대표이사·무한책임사원 또는 최대주주 중 어느 하나에도 해당하지 않으면 제한됩니다.`],`2. 대출제한대상 — 11. (법인기업) 실제경영자부적정`,[`법인`,`실제경영자`,`최대주주`]),w(`restriction-management`,`12. 법인 책임경영 심사`,`책임경영심사 결격요건 또는 C등급(미흡)이면 지원 불가입니다.`,[`결격요건에 한 항목이라도 저촉되거나 심사요건 평가점수가 70점 미만인 경우입니다.`,`이 도우미는 책임경영심사 점수나 평가등급을 계산하지 않습니다.`],`2. 대출제한대상 — 12. (법인기업) 책임경영 심사 관련 제한`,[`법인`,`책임경영`,`C등급`,`70점`]),w(`restriction-social`,`13. 사회적 물의`,`임직원의 자금횡령 등 사회적 물의를 일으킨 경우 제한됩니다.`,[],`2. 대출제한대상 — 13. 사회적 물의`,[`횡령`,`사회적물의`]),w(`restriction-fraud`,`14. 허위·부정 신청`,`제3자 부당개입 등 허위 또는 부정한 방법으로 신청한 경우 제한됩니다.`,[`브로커 개입, 허위자료 등은 지원요건 확인과 별개로 확인합니다.`],`2. 대출제한대상 — 14. 허위 또는 부정 신청`,[`브로커`,`부정신청`,`허위자료`]),w(`restriction-limit`,`15. 대출한도 산출 불가`,`신청정보·서류상 심사를 진행해도 대출한도 산출이 불가능한 경우 제한됩니다.`,[`최대 3,000만원이라는 자금상한만으로 개인별 한도가 나온다고 안내하지 않습니다.`],`2. 대출제한대상 — 15. 대출한도 산출 불가`,[`한도`,`산출불가`])]},{id:`process`,title:`신청·심사 절차`,summary:`온라인 신청 → 자동 검증 → 정책우선도 평가 → 선정기업 서류 제출 → 심사 → 약정·실행 순서입니다.`,items:[w(`process-online`,`1. 정책자금 누리집 온라인 신청`,`신용취약소상공인자금은 온라인으로 신청합니다.`,[`지침은 현장 신청 접수 불가로 정합니다. 지역센터 방문이 처음 신청 경로라는 뜻으로 안내하지 않습니다.`,`지침의 홀짝제 언급과 실제 회차별 접수 일정·방식은 최신 공고로 함께 확인합니다. 이 안내는 현재 접수 중임을 뜻하지 않습니다.`],`1. 개요 — 융자 절차; 4. 대출절차 ①`,[`온라인`,`신청`,`홀짝제`,`접수`]),w(`process-validation`,`2. 지원대상·제한사항 검증`,`소상공인 여부, NCB 점수, 제한사항 등을 공공마이데이터 등으로 확인합니다.`,[`필요하면 추가 서류를 요청할 수 있으며 지침상 보완기간은 최대 2일 이내입니다.`,`자동검증이 어려운 제외업종·허위 또는 부정신청은 심사 단계에서 별도로 확인합니다.`],`4. 대출절차 ② 대출제한대상 검증`,[`마이데이터`,`검증`,`보완`,`2일`]),w(`process-priority`,`3. 정책우선도 평가 결과 확인`,`결과는 선정·예비·미선정으로 구분되며, 선정이 곧 대출 승인은 아닙니다.`,[`정책자금 수혜이력·업력·직접대출 성실상환·정책우대기업 등을 고려합니다. 이 사이트에서 점수·순위·승인확률을 만들지 않습니다.`,`선정: 관할 지역센터 배정 후 기한 내 신청서류 제출. 예비: 선정기업의 부결·취소가 발생하면 선정으로 변경될 수 있음. 미선정: 예비 순위에 포함되지 않은 경우.`,`선정되지 않았으면 차기 신용취약소상공인자금 재신청이 가능합니다.`],`4. 대출절차 ③ 정책우선도 평가 진행`,[`정책우선도`,`선정`,`예비`,`미선정`,`재신청`]),w(`process-documents`,`4. 선정기업 서류 제출·신청 접수`,`제출서류로 본인확인·지원요건·제한사항을 확인한 뒤 접수합니다.`,[`서류의 제출 대상·유효기간·선택동의 여부를 구분하고 선정 안내의 제출기한을 확인합니다.`],`3. 제출서류 — ②; 4. 대출절차 ④`,[`선정`,`서류`,`접수`]),w(`process-review`,`5. 심사·한도 결정 및 필요한 실사`,`교육·업력·신용평점·제한사항과 한도를 확인하고 필요한 경우 사업장 실사를 진행합니다.`,[`법인은 책임경영심사를 실시합니다. 신청 당시 NCB 점수가 839점을 초과하면 지원 불가입니다.`,`연매출 2,000만원 이하 또는 사업장과 거주주택 주소가 같은 무점포 업체는 실사 유형에 해당하며, 지침상 생략조건은 별도로 확인합니다.`,`필요하면 실제 영업·서류 위조 또는 부정신청·제3자 부당개입을 확인합니다.`],`4. 대출절차 ⑤ 심사·대출한도 사정`,[`심사`,`실사`,`무점포`,`2000만원`,`사업장`]),w(`process-agreement`,`6. 개인 전자약정 · 법인 대면약정`,`지원 결정 후 약정하고 실행합니다. 처음 신청방법과 약정방법을 구분하세요.`,[`개인은 약정시스템에서 전자약정을 체결합니다.`,`법인은 승인통보 후 대표이사가 지역센터를 방문하여 대면약정합니다. 조건을 설명하고 약정서·상품설명서 등 사본을 교부합니다.`],`4. 대출절차 ⑥ 대출약정`,[`전자약정`,`법인`,`대면약정`,`실행`]),w(`process-followup`,`7. 대출금 사용내역 사후점검`,`대출실행 후 90일 이내 폐업 또는 허위·부정신청 의심 등의 경우 사용내역을 점검합니다.`,[`점검대상은 통지일부터 30일 이내 대출금사용내역표와 사용 증빙을 제출합니다. 지침의 미제출·연락불능 등 사유에서는 1회, 최대 14일 연장하여 재요청할 수 있습니다.`,`용도 외 사용·허위제출·미사용 잔액 등은 판정과 상환·제재 절차가 달라집니다. 사업 용도 사용 증빙을 준비하도록 안내합니다.`],`4. 대출절차 ⑦ 사후관리 — 점검대상·점검통지·점검결과`,[`사후관리`,`90일`,`30일`,`14일`,`사용내역`])]},{id:`staff-tips`,title:`직원 확인 메모`,summary:`상담에서 혼동하기 쉬운 기준과 실사·사후관리 확인점을 모았습니다.`,items:[w(`tips-dates`,`개정일·제한기준 적용일·현재 접수를 구분`,`지침 개정일은 2026-08-04, 대출제한기준은 2026-07-13 접수 건부터 적용합니다.`,[`그 이전 접수 건은 종전 지침을 적용합니다. 이 안내의 검토일은 제공 자료를 정리한 날짜이며 현재 접수·예산이나 이후 공고까지 검증한 날짜가 아닙니다.`],`문서 개정내역; 2. 대출제한대상 — 적용기준; 1. 개요 — 융자 절차`,[`개정일`,`적용일`,`접수`,`2026-07-13`,`2026-08-04`]),w(`tips-scopes`,`서로 다른 신용·매출·업력 기준을 섞지 않기`,`개인 NCB 점수, 기업 NICE SOHO ML 등급, 업력·매출의 용도가 각각 다릅니다.`,[`NCB 839점 이하: 신청요건. 기업등급 9~10등급의 1억 9,700만원: 추가 제한. 연매출 2,000만원 이하: 실사 대상 기준.`,`인정 업력 90일: 신청요건. 업력 7년 이하: 제한항목 7~9의 예외. 7년 미만으로 잘못 바꾸지 않습니다.`,`정책우선도 미선정과 심사 부결의 재신청 기준도 구분합니다.`],`1. 개요 — 지원대상·기업등급별 한도 표; 2. 대출제한대상 6~9; 4. 대출절차 ③·⑤`,[`NCB`,`SOHO ML`,`매출`,`업력`,`실사`,`재신청`]),w(`tips-site-visit`,`실사 대상의 매출 확인 방법`,`원칙적으로 국세청 표준재무제표증명으로 확인하며 대체자료·업력 12개월 미만 기준을 구분합니다.`,[`표준재무제표증명 제출이 불가하면 부가가치세과세표준증명 또는 면세사업자수입금액증명 등으로 확인합니다.`,`업력 12개월 미만이면 국세청 신고매출액과 여신금융협회 카드매출액 중 높은 금액을 연간매출액으로 적용할 수 있으며 세부 산정은 공통지침을 대조합니다.`,`실사에서는 실제 영업, 위조·부정신청 여부, 제3자 부당개입 여부를 종합 확인합니다. 단순히 실사 대상이라는 이유로 탈락 처리하지 않습니다.`],`4. 대출절차 ⑤ — 실사대상 유형·연간매출액 확인 방법·실사 세부 확인항목`,[`실사`,`매출`,`12개월`,`카드매출`]),w(`tips-site-exemption`,`저매출·무점포 실사 생략조건은 별도 확인`,`실사 유형 ②~③에 대해 지침의 4가지 조건 중 하나라도 해당하면 생략할 수 있습니다.`,[`최근 6개월 이내 해당 신청업체 실사를 이미 진행하고 그 사실을 증빙할 수 있는 경우.`,`건설장비업·운수업·어업의 신고·허가 관련 자료로 사업 운영이 확인되는 경우.`,`점포가 있는 음식·숙박업 등에서 플랫폼 등록·운영 정보로 영업사실을 확인하고 업체명·대표자명·사업자번호·주소가 일치하는 경우.`,`무점포 업체 중 기업등급 1~5등급이면서 연매출 2,000만원 초과인 경우, 또는 홈페이지·플랫폼 운영 여부가 확인되는 전자상거래업인 경우.`,`확인 근거를 갖추어야 하며, 사실상 휴업·부정신청 등 다른 실사 사유까지 일괄 면제하는 조건은 아닙니다.`],`4. 대출절차 ⑤ — 실사생략·실사 생략가능 조건`,[`실사생략`,`무점포`,`6개월`,`플랫폼`,`1~5등급`,`2000만원`]),w(`tips-followup`,`사후점검 부적합 안내 시 기한 확인`,`의견제출·상환 기한과 미상환 제재를 구분해 설명합니다.`,[`부적합 결과에 이의가 있으면 통지일부터 30일 이내 1회 의견제출이 가능하며, 이의신청 처리 중 후속 상환통지 등은 유예됩니다.`,`부적합 판정금액은 상환통지 도달(간주)일부터 90일 이내 상환 대상입니다. 용도 외 사용액·연락불능 또는 허위제출·폐업 시 미사용액에 따라 판정금액이 다릅니다.`,`기한 내 미상환 시 전액 기한의 이익 상실 및 동일관계기업을 포함한 3년 신규대출 제한 등 지침의 절차를 적용하며, 긴급경영안정자금(재해) 예외를 확인합니다.`],`4. 대출절차 ⑦ — 이의신청·상환통지·상환·제재처분`,[`이의신청`,`30일`,`90일`,`사후관리`,`제재`,`3년`])]}],links:[{label:`소상공인정책자금 · 신청 및 최신 접수 공고 확인`,url:ae},{label:`소상공인 지식배움터 · 신용관리교육 확인`,url:`https://edu.sbiz.or.kr/`}],cautions:[`2026-08-04 개정 제공 지침을 정리한 안내입니다. 접수 여부·예산·이후 변경공고와 현재 분기 기준금리는 별도 확인해야 합니다.`,`최종 지원 여부와 금액은 정책우선도 평가, 공단 심사, 증빙 및 접수 상황에 따라 결정됩니다.`,`원문 병합표의 기업등급별 세부 한도 대응은 확인 필요로 남겼습니다. 이 안내는 승인액·승인확률을 계산하지 않습니다.`,`공식 누리집 링크는 신청·현황 확인용입니다. 첨부 지침 원문 파일의 직접 다운로드 링크가 아닙니다.`]},le=s((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})
